[project]
name = "plans2dfca"
version = "0.1.0"
description = "Python scripts to convert sets of plans to Deterministic Finite Cover Automata (DFCA)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adjusttext>=1.4.0",
    "graphviz>=0.21",
    "lab>=8.11",
    "networkx>=3.7",
    "pydot>=4.0.1",
    "pyvis>=0.3.2",
]
